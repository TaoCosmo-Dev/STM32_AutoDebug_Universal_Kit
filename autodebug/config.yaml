# STM32 Auto-Debug & Self-Healing Pipeline Configuration
keil:
  uv4_path: "D:\\keil5\\UV4\\UV4.exe"
  fromelf_path: "D:\\keil5\\ARM\\ARMCC\\bin\\fromelf.exe"

debugger:
  type: "pyocd"          # Options: "pyocd", "jlink", "gdb"
  target_override: null  # Target chip (null = auto-detect from .uvprojx)
  probe_id: null         # Probe serial number (null = auto-detect first active probe)
  jlink_path: "C:\\Program Files\\SEGGER\\JLink\\JLink.exe"
  jlink_gdb_server: "C:\\Program Files\\SEGGER\\JLink\\JLinkGDBServerCL.exe"

serial:
  port: null             # Serial port (null = auto-detect USB-UART COM port)
  baudrate: 115200
  timeout_seconds: 10    # Timeout waiting for test result or assert

test:
  max_repair_iterations: 5
  pass_keywords:
    - "[ALL TESTS PASSED]"
    - "TESTS_PASSED"
    - "OK (all tests passed)"
  fail_keywords:
    - "[TEST FAILED]"
    - "ASSERTION_FAILED"
    - "HardFault_Handler"
    - "cm_backtrace"
